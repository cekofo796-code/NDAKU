<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — NDAKU Immobilier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="section" style="padding-top:56px;">
    <div class="container" style="max-width:440px;">
      <h1 style="text-align:center;">Connexion</h1>
      <p style="text-align:center; color:var(--text-soft); margin-bottom:32px;">Accédez à votre espace NDAKU.</p>

      <form class="form-card" id="login-form">
        <p class="form-error" id="login-error" hidden></p>
        <div class="field" style="margin-bottom:18px;">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field" style="margin-bottom:24px;">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn--gold btn--block">Se connecter</button>
        <p class="form-footer-link">Pas encore de compte ? <a href="inscription.html" style="color:var(--gold); font-weight:600;">Créer un compte</a></p>
      </form>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/properties.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("login-error");
    const result = loginUser(document.getElementById("email").value, document.getElementById("password").value);
    if (!result.success) {
      errorEl.textContent = result.message;
      errorEl.hidden = false;
      return;
    }
    const redirect = new URLSearchParams(window.location.search).get("redirect");
    window.location.href = redirect || "dashboard.html";
  });
</script>
</body>
</html>
