<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NDAKU immobilier"><title>Publier un bien — NDAKU</title><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div><main><section class="page"><div class="container"><h1>Publier un bien</h1><p>Créez votre annonce.</p></div></section><section class="section"><div class="container"><form id="publish" class="form"><h2>Informations générales</h2><div class="two"><label>Titre<input name="title" required></label><label>Type<select name="type"><option>Maison</option><option>Appartement</option><option>Terrain</option><option>Commerce</option></select></label><label>Transaction<select name="t"><option value="sale">Vente</option><option value="rent">Location</option></select></label><label>Prix<input name="price" type="number" required></label><label>Ville<input name="city" required></label><label>Localisation<input name="loc" placeholder="Commune · Quartier"></label><label>Surface<input name="area" type="number"></label><label>Chambres<input name="b" type="number"></label><label>Salles de bain<input name="s" type="number"></label></div><label>Description<textarea rows="7" name="description"></textarea></label><button class="btn primary">Publier l'annonce</button><p style="color:#687385;font-size:12px">Mode frontend : données conservées dans LocalStorage sur cet appareil.</p></form></div></section></main><div id="footer"></div><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/publish.js"></script></body></html>
