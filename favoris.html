<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes favoris — NDAKU Immobilier</title>
<meta name="description" content="Retrouvez tous les biens immobiliers que vous avez ajoutés en favoris sur NDAKU.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="page-header">
    <div class="container">
      <h1>Mes favoris</h1>
      <p>Retrouvez ici tous les biens que vous avez ajoutés à vos coups de cœur.</p>
    </div>
  </div>

  <section class="section--tight">
    <div class="container">
      <div class="properties-grid" id="favorites-grid"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/properties.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
  function refreshFavoritesEmptyState() {
    const grid = document.getElementById("favorites-grid");
    if (!grid.querySelector(".property-card")) {
      grid.innerHTML = renderEmptyState("Vous n'avez pas encore de favoris.");
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const favorites = getFavoriteProperties();
    const grid = document.getElementById("favorites-grid");
    grid.innerHTML = favorites.length
      ? favorites.map(renderPropertyCard).join("")
      : renderEmptyState("Vous n'avez pas encore de favoris.");
  });
</script>
</body>
</html>
