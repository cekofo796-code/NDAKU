<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="NDAKU immobilier"><title>Dashboard — NDAKU</title><link rel="stylesheet" href="css/style.css"></head><body><div id="header"></div><main><section class="section"><div class="container"><h1>Tableau de bord</h1><div class="values"><div class="card"><small>Annonces</small><h2 id="pc">0</h2></div><div class="card"><small>Favoris</small><h2 id="fc">0</h2></div><div class="card"><small>Messages</small><h2>0</h2></div></div><div class="section"><div class="panel"><h2>Mes annonces</h2><div id="dash"></div></div></div></div></section></main><script>document.addEventListener('DOMContentLoaded',()=>{pc.textContent=props().length;fc.textContent=favs().length;dash.innerHTML=props().slice(0,8).map(p=>`<p><b>${p.title}</b> — ${money(p.price,p.t)} <a class="btn outline" href="details.html?id=${p.id}">Voir</a></p>`).join('')})</script><div id="footer"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
